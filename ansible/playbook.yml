---
- name: Configure StudShare Production Server
  hosts: webservers
  become: true

  tasks:
    - name: Update apt cache and upgrade OS packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: safe
        cache_valid_time: 3600

    - name: Install required system packages and UFW
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
        state: present

    - name: Allow SSH, HTTP, and HTTPS in UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"
        - "3000"

    - name: Enable UFW with default deny incoming policy
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Create directory for apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker official apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        filename: docker
        state: present

    - name: Install Docker Engine and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add azureuser to docker group
      ansible.builtin.user:
        name: azureuser
        groups: docker
        append: true

    - name: Ensure Docker service is started and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create StudShare project directories
      ansible.builtin.file:
        path: "/opt/studshare/{{ item }}"
        state: directory
        owner: azureuser
        group: docker
        mode: "0755"
      loop:
        - ""
        - "app"
        - "data"
        - "nginx"
