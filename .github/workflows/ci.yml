name: StudShare CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # 1. Linting & Formatting Stage (ESLint + Hadolint)
  lint:
    name: Lint Code & Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Backend npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-backend-

      - name: Install & Lint Backend
        working-directory: backend
        run: |
          npm install
          npm run lint

      - name: Cache Frontend npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-frontend-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-frontend-

      - name: Install & Lint Frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint

      - name: Lint Backend Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

      - name: Lint Frontend Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

  # 2. Automated Testing Stage (Unit Tests + Build Verification)
  test:
    name: Run Tests & Verify Builds
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Backend npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-backend-

      - name: Run Backend Unit Tests
        working-directory: backend
        run: |
          npm install
          npm test

      - name: Cache Frontend npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-frontend-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-frontend-

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: |
          npm install
          npm run build

  # 3. DevSecOps Stage (Software Composition Analysis with Trivy)
  security-fs:
    name: Security Scan (Dependencies & Configs)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

  # 4. Build, Image Security Scan & Publish Stage (GHCR)
  build-and-push:
    name: Build, Scan & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test, security-fs]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (GIT_SHA & SemVer tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/studshare-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build Docker image locally for security scan
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          load: true
          tags: studshare-${{ matrix.service }}:ci

      - name: Scan built Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: studshare-${{ matrix.service }}:ci
          format: "table"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 5. Continuous Deployment & Post-Deploy Smoke Test
  deploy:
    name: Deploy to Azure VM & Smoke Test
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Transfer compose & monitoring configs to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml "$SERVER_USER@$SERVER_HOST:/opt/studshare/app/"
          scp -o StrictHostKeyChecking=no -r monitoring "$SERVER_USER@$SERVER_HOST:/opt/studshare/app/"

      - name: Deploy containers on Azure VM via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          SHORT_SHA: ${{ github.sha }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: |
          OWNER_LOWER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="sha-${SHORT_SHA:0:7}"

          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "
            set -e
            cd /opt/studshare/app
            printf '%s\n' \
              'GITHUB_OWNER=$OWNER_LOWER' \
              'IMAGE_TAG=$IMAGE_TAG' \
              'POSTGRES_USER=$POSTGRES_USER' \
              'POSTGRES_PASSWORD=$POSTGRES_PASSWORD' \
              'POSTGRES_DB=$POSTGRES_DB' \
              'BACKEND_PORT=3000' \
              'GRAFANA_USER=admin' \
              'GRAFANA_PASSWORD=$GRAFANA_PASSWORD' > .env
            echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          "

      - name: Post-Deploy Smoke Test (HTTP 200 OK)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "Running smoke test against http://$SERVER_HOST/healthz ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$SERVER_HOST/healthz" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed! Application is healthy (HTTP 200 OK)."
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed! Expected HTTP 200 OK."
          exit 1