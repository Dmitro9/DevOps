name: StudShare CI Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # 1. Linting & Formatting Stage (ESLint + Hadolint)
  lint:
    name: Lint Code & Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Backend npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-backend-

      - name: Install & Lint Backend
        working-directory: backend
        run: |
          npm install
          npm run lint

      - name: Cache Frontend npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-frontend-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-frontend-

      - name: Install & Lint Frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint

      - name: Lint Backend Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

      - name: Lint Frontend Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

  # 2. Automated Testing Stage (Unit Tests + Build Verification)
  test:
    name: Run Tests & Verify Builds
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Backend npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-backend-

      - name: Run Backend Unit Tests
        working-directory: backend
        run: |
          npm install
          npm test

      - name: Cache Frontend npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-frontend-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-frontend-

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: |
          npm install
          npm run build

  # 3. DevSecOps Stage (Software Composition Analysis with Trivy)
  security-fs:
    name: Security Scan (Dependencies & Configs)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

  # 4. Build, Image Security Scan & Publish Stage (GHCR)
  build-and-push:
    name: Build, Scan & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test, security-fs]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (GIT_SHA & SemVer tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/studshare-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build Docker image locally for security scan
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          load: true
          tags: studshare-${{ matrix.service }}:ci

      - name: Scan built Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: studshare-${{ matrix.service }}:ci
          format: "table"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}